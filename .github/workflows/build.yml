name: Windows native build and offline checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Enforce local-only script policy
        run: dotnet run --project Testing/RepositoryPolicyChecks/RepositoryPolicyChecks.csproj -c Release -- .
      - name: Build MM Zidoo Sync
        run: dotnet build MediaMonkeyZidooSync/MediaMonkeyZidooSync.csproj -c Release --nologo
      - name: NativeOrchestrationTests
        run: dotnet run --project NativeOrchestrationTests/NativeOrchestrationTests.csproj -c Release --nologo
      - name: RecoveryTests
        run: dotnet run --project RecoveryTests/RecoveryTests.csproj -c Release --nologo
      - name: RunHistoryDurabilityTests
        run: dotnet run --project RunHistoryDurabilityTests/RunHistoryDurabilityTests.csproj -c Release --nologo
      - name: IsolatedSyncTests
        run: dotnet run --project IsolatedSyncTests/IsolatedSyncTests.csproj -c Release --nologo
      - name: NativeDeviceTests
        run: dotnet run --project NativeDeviceTests/NativeDeviceTests.csproj -c Release --nologo
      - name: Unsigned Windows build; no publication
        run: dotnet publish MediaMonkeyZidooSync/MediaMonkeyZidooSync.csproj -c Release -r win-x64 --self-contained true -o artifacts/windows --nologo

      - name: Build unsigned MSI with native Windows tools
        run: dotnet run --project Packaging/MsiBuilder/MsiBuilder.csproj -c Release -- artifacts/windows artifacts/MM-Zidoo-Sync.msi 1.1.3
